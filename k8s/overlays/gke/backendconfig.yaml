# GKE-specific: tells the GCE load balancer to health-check /healthz rather
# than /, which is what stops the BFF backend flapping as unhealthy.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: carto-bff-backendconfig
  namespace: carto
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
