# ===========================================================================
#  PLACEHOLDER ONLY — do not put real keys in this file, and do NOT add it to
#  kustomization.yaml. Applying it overwrites a populated carto-secrets with
#  empty strings; the Agent then exits with "You must set either a DD_API_KEY"
#  and the cause is three steps away from the symptom.
#
#  This manifest exists so `kubectl apply -k k8s/base` works out of the box and
#  so the shape of the Secret is documented. It is tracked in git, therefore
#  every value in it is empty.
#
#  Supply the real values one of these ways, in order of preference:
#
#  1. From your carto.env, without ever writing a key to disk in the repo:
#       kubectl -n carto create secret generic carto-secrets \
#         --from-literal=DD_API_KEY="$DD_API_KEY" \
#         --from-literal=DD_APP_KEY="$DD_APP_KEY" \
#         --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#         --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#         --from-literal=GUARDRAIL_AGENT_TOKEN="$GUARDRAIL_AGENT_TOKEN" \
#         --dry-run=client -o yaml | kubectl apply -f -
#     This is what scripts/gke-deploy.sh does for you.
#
#  2. Google Secret Manager via the Secrets Store CSI driver, for a real
#     deployment. See the README section "Credentials in Kubernetes".
#
#  Never commit a populated copy. The .gitignore covers k8s/**/secret.local.yaml
#  if you want a scratch copy on disk.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: carto-secrets
  namespace: carto
type: Opaque
stringData:
  DD_API_KEY: ""
  DD_APP_KEY: ""
  ANTHROPIC_API_KEY: ""
  POSTGRES_PASSWORD: "webapppw"
  GUARDRAIL_AGENT_TOKEN: "carto-agent-attestation"
