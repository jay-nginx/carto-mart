# nginx config for serving the Carto Vite-built React SPA with client-side
# routing. Three things matter here:
#   1. try_files $uri $uri/ /index.html — so deep links like /orders/42
#      hit the React Router instead of 404'ing.
#   2. gzip on for the bundle (JS/CSS compress well).
#   3. long-cache for fingerprinted /assets/* (Vite emits hashed names),
#      no-cache for index.html (so new deploys actually load).
user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    # Without these, nginx serves every response as text/plain, which
    # makes browsers reject ES module scripts under "Strict MIME type
    # checking" — the SPA never executes its JS bundle. Inheriting the
    # standard mime map (which includes application/javascript for *.js
    # and text/css for *.css) is mandatory for a Vite SPA.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Vite emits ES module bundles. Force the correct MIME for *.js (and
    # for the *.mjs extension some Vite plugins still emit) — the stock
    # mime.types in nginx-alpine 1.27 already does this, but state it
    # explicitly so a future image bump can't silently regress.
    types {
        application/javascript js mjs;
        text/css               css;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Add a small traceability header so an SE can confirm which
        # service the served bundle belongs to. The actual DD_SERVICE
        # tag also flows via the RUM SDK from the bundle itself.
        add_header X-DD-Service "carto-web" always;

        # Hashed assets get aggressive caching — Vite fingerprints them.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html is the entry point — always revalidate so new
        # deploys are picked up immediately.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Healthcheck endpoint — cheap 200 with no I/O. Useful if the
        # topology slaps a healthcheck on the service.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # /api/* → checkout BFF (compose-network hostname). Same-origin
        # proxy so the SPA's fetch('/api/...') works whether the browser
        # is human (visiting localhost:5173 from the host) or headless
        # inside a Puppeteer container on the compose network.
        # Carto's BFF service is named `bff`.
        location /api/ {
            proxy_pass http://bff:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Forward the W3C / Datadog trace headers RUM injects so the
            # backend trace continues from the browser side. nginx
            # passes ALL upstream-bound request headers by default, so
            # this is here primarily as documentation.
            proxy_pass_request_headers on;
            proxy_read_timeout 30s;
        }

        # RUM intake proxy, generated by `make rum-unblock` when this
        # network's DNS blocks browser-intake-<site>.
        #
        # The browser cannot resolve the intake hostname, so the RUM SDK is
        # pointed at /dd-rum on THIS origin instead and nginx forwards it. A
        # same-origin request needs no DNS lookup of the blocked name, which is
        # the only way to fix the operator's own browser — `extra_hosts` only
        # ever helped the containers.
        #
        # A wildcard include that matches nothing is not an error in nginx, so
        # when the snippet is absent this is a no-op and RUM goes direct.
        include /etc/nginx/rum-proxy/*.conf;

        # SPA fallback: any path that doesn't map to a real file
        # falls through to index.html so React Router can take it.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
