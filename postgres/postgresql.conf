# Postgres 16 settings tuned for DBM richness on a laptop demo (Carto).
# This file is mounted on top of the official image's default conf via
# the `command` line in compose.fragment.yaml.

# === Connection ===
listen_addresses = '*'

# === Logging ===
# Standard Postgres CSV log format gives DD's postgres log integration
# the most context per line. Slow query logging at 500ms.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500    # ms — slow query threshold
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'none'              # don't log every statement; let pg_stat_statements + slow log do it
log_min_messages = 'WARNING'

# === Statistics & monitoring ===
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# pg_stat_statements: tracks normalized query execution stats. DBM reads
# these directly. Track plans + queries and don't reset.
pg_stat_statements.track = 'all'
pg_stat_statements.track_utility = on
pg_stat_statements.track_planning = on
pg_stat_statements.max = 10000

# auto_explain: emit EXPLAIN plans for any query slower than 500ms into
# the postgres logs. DBM correlates these with pg_stat_statements rows.
auto_explain.log_min_duration = 500
auto_explain.log_format = 'json'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on

# === Performance reporting ===
track_activity_query_size = 4096
track_io_timing = on
